<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="batch-title batch-desc" id="d-01-static-vs-continuous-batching-root">
        <title id="batch-title">Static batching contra continuous batching</title>
        <desc id="batch-desc">Cuatro peticiones, A y B al inicio, C y D después. Con static batching C y D esperan hasta el paso 18. Con continuous batching C entra en el paso 3 y D en el 6.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-01-static-vs-continuous-batching-root { font-family: 'Geist', system-ui, sans-serif; color: #0F2547; }
      #d-01-static-vs-continuous-batching-root .diagram-container { width: 100%; overflow-x: auto; }</style>
  </defs>
        <rect width="1040" height="500" fill="#F7F6F2"/>
        <text x="40" y="60" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Static batching</text>
        <text x="40" y="76" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">el batch se arma una vez y nadie entra hasta que acaba la respuesta más larga</text>
        <text x="40" y="109" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">A, informe largo</text>
        <rect x="200" y="94" width="576" height="22" rx="3" fill="#0f2547" fill-opacity="0.10" stroke="#3B5B8C" stroke-width="1"/>
        <text x="40" y="143" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">B, pregunta corta</text>
        <rect x="200" y="128" width="160" height="22" rx="3" fill="#0f2547" fill-opacity="0.10" stroke="#3B5B8C" stroke-width="1"/>
        <rect x="360" y="128" width="416" height="22" rx="3" fill="#0f2547" fill-opacity="0.04" stroke="#0f2547" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="368" y="143" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">lugar vacío hasta que acabe A</text>
        <text x="40" y="177" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">C, llega en el paso 3</text>
        <rect x="296" y="162" width="480" height="22" rx="3" fill="#0f2547" fill-opacity="0.04" stroke="#C59216" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="776" y="162" width="160" height="22" rx="3" fill="#c59216" fill-opacity="0.18" stroke="#C59216" stroke-width="1"/>
        <text x="304" y="177" fill="#9A6F0B" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">espera 15 pasos</text>
        <text x="40" y="211" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">D, llega en el paso 6</text>
        <rect x="392" y="196" width="384" height="22" rx="3" fill="#0f2547" fill-opacity="0.04" stroke="#0f2547" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="776" y="196" width="160" height="22" rx="3" fill="#0f2547" fill-opacity="0.10" stroke="#3B5B8C" stroke-width="1"/>
        <text x="400" y="211" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">espera 12 pasos</text>
        <text x="40" y="250" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Continuous batching, como vLLM</text>
        <text x="40" y="266" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">en cada paso de decode se decide quién va en el batch</text>
        <text x="40" y="299" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">A, informe largo</text>
        <rect x="200" y="284" width="576" height="22" rx="3" fill="#0f2547" fill-opacity="0.10" stroke="#3B5B8C" stroke-width="1"/>
        <text x="40" y="333" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">B, pregunta corta</text>
        <rect x="200" y="318" width="160" height="22" rx="3" fill="#0f2547" fill-opacity="0.10" stroke="#3B5B8C" stroke-width="1"/>
        <text x="40" y="367" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">C, llega en el paso 3</text>
        <rect x="296" y="352" width="160" height="22" rx="3" fill="#c59216" fill-opacity="0.18" stroke="#C59216" stroke-width="1"/>
        <text x="464" y="367" fill="#9A6F0B" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">entra en el siguiente paso</text>
        <text x="40" y="401" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">D, llega en el paso 6</text>
        <rect x="392" y="386" width="160" height="22" rx="3" fill="#0f2547" fill-opacity="0.10" stroke="#3B5B8C" stroke-width="1"/>
        <text x="560" y="401" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">toma el lugar libre de B</text>
        <line x1="200" y1="212" x2="968" y2="212" stroke="#0f2547" stroke-opacity="0.25" stroke-width="0.8"/>
        <text x="968" y="226" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace" text-anchor="end">pasos de decode</text>
        <line x1="200" y1="402" x2="968" y2="402" stroke="#0f2547" stroke-opacity="0.25" stroke-width="0.8"/>
        <text x="968" y="416" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace" text-anchor="end">pasos de decode</text>
        <text x="40" y="448" fill="#3B5B8C" font-size="14" font-weight="400" font-family="'Instrument Serif', serif" font-style="italic">Medido en una L4, la respuesta corta termina en 0.99 s. Con static batching habría tardado 13.75 s.</text>
        <line x1="40" y1="468" x2="1000" y2="468" stroke="#0f2547" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="486" fill="#3B5B8C" font-size="8" font-weight="400" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
        <rect x="120" y="478" width="12" height="10" rx="3" fill="#0f2547" fill-opacity="0.04" stroke="#0f2547" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="138" y="486" fill="#0F2547" font-size="9" font-weight="400" font-family="'Geist', sans-serif">espera en cola</text>
        <rect x="240" y="478" width="12" height="10" rx="3" fill="#c59216" fill-opacity="0.18" stroke="#C59216" stroke-width="1"/>
        <text x="258" y="486" fill="#0F2547" font-size="9" font-weight="400" font-family="'Geist', sans-serif">la petición que cambia de historia</text>
        <text x="520" y="486" fill="#0F2547" font-size="9" font-weight="400" font-family="'Geist', sans-serif">pasos ilustrativos, cada uno produce un token por petición activa</text>
      </svg>
